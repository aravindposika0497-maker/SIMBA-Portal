# /etc/nginx/sites-available/simba-portal
# Plain HTTP on port 80 is intended ONLY behind an internal ALB that terminates HTTPS.
# The instance security group must allow port 80 from the ALB security group only.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;
    # ALB OIDC headers (x-amzn-oidc-*) can be several KB
    large_client_header_buffers 4 32k;

    access_log /var/log/nginx/simba-portal.access.log;
    error_log  /var/log/nginx/simba-portal.error.log warn;

    proxy_set_header Host              $host;
    # Pass the ALB's X-Forwarded-For through unchanged (Flask ProxyFix trusts one hop)
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    location /static/ {
        alias /opt/simba-portal/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    # Server-Sent Events: no buffering, long read timeout
    location = /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
