<title id="title">SIMBA Data Platform Reference Architecture</title><desc id="desc">RedApp and Plumery source systems feed Kafka and JDBC ingestion into Databricks workflows and Bronze, Silver, Gold lakehouse layers governed by Unity Catalog. Databricks SQL serves Power BI and analytics consumers.</desc>
